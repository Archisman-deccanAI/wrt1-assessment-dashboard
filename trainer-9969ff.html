function build(){
 const k=DATA.kpis,pa=DATA.per_assessment,sk=DATA.skip_handling;
 let h='<section><div class="head"><span class="eyebrow">Overview</span><h2>Cohort performance</h2><span class="sub">two standards: RCA benchmark and HLQA crowd; skip items scored separately</span></div><div class="kpis">';
 h+=tile('RCA accuracy',k.overall_accuracy+'<small>%</small>',k.items_scored+' items \u00b7 vs RCA benchmark',true);
 h+=tile('HLQA accuracy',k.hlqa_accuracy+'<small>%</small>',k.hlqa_agreement+'% agree with RCA');
 h+=tile('Lenient accuracy',k.lenient_accuracy+'<small>%</small>',k.partial_total+' near-misses, half credit');
 h+=tile('Avg time / task',fmtT(k.avg_time_task_sec),'median '+fmtT(k.median_time_task_sec));
 h+=tile('Avg time / item',fmtT(k.avg_time_item_sec),'per product in a task');
 h+=tile('Annotators',k.n_annotators,'took the assessment');
 h+=tile('Tasks submitted',k.n_tasks,'grouped tasks');
 h+='</div><div class="note"><b>RCA accuracy</b> scores each pick against the RCA/benchmark answer; <b>HLQA accuracy</b> scores the same pick against the HLQA crowd answer (the two answers agree on '+k.hlqa_agreement+'% of items). <b>Strict</b> requires the exact Product Type; <b>lenient</b> gives half credit to near-misses in the same taxonomy subcategory or a near-identical type ('+k.partial_total+' near-misses vs RCA of '+(k.items_scored)+' scored items).</div></section>';
 h+='<section><div class="head"><span class="eyebrow">By assessment</span><h2>Batch 63 vs Batch 67</h2></div><div class="cmp">';
 pa.forEach(a=>{h+='<div class="acard"><span class="tag">'+esc(a.assessment)+'</span><div class="big" style="color:'+tcol(a.accuracy)+'">'+a.accuracy+'<small style="font-size:18px;color:var(--muted)">% RCA</small></div><div class="row"><span>HLQA accuracy</span><b class="num" style="color:'+tcol(a.hlqa_accuracy)+'">'+a.hlqa_accuracy+'%</b></div><div class="row"><span>Items scored</span><b class="num">'+a.items+'</b></div><div class="row"><span>Tasks submitted</span><b class="num">'+a.tasks+' / '+a.available+' ('+a.completion+'%)</b></div><div class="row"><span>Avg time / task</span><b class="num">'+fmtT(a.avg_time_task_sec)+'</b></div><div class="row"><span>Avg time / item</span><b class="num">'+fmtT(a.avg_time_item_sec)+'</b></div></div>';});
 h+='</div></section>';
 h+='<section><div class="head"><span class="eyebrow">People</span><h2>Annotator leaderboard</h2><span class="sub">click a column to sort</span></div><div class="card" style="overflow-x:auto"><table id="lb"><thead><tr><th></th><th class="sortable" data-k="annotator">Annotator</th><th class="sortable num" data-k="accuracy">RCA</th><th class="sortable num" data-k="hlqa_accuracy">HLQA</th><th class="sortable num" data-k="lenient_accuracy">Lenient</th><th class="sortable num hide-sm" data-k="b63">B63</th><th class="sortable num hide-sm" data-k="b67">B67</th><th class="sortable num hide-sm" data-k="partial">Partial</th><th class="sortable num" data-k="items">Items</th><th class="sortable num" data-k="avg_time_task_sec">Time/task</th><th class="num hide-sm">Conflict flags</th></tr></thead><tbody id="lbb"></tbody></table></div></section>';
 h+='<section class="two"><div><div class="head"><span class="eyebrow">Quality vs speed</span><h2>Speed &amp; accuracy</h2></div><div class="card scatter-wrap"><div id="sc"></div><div class="legend"><span><i style="background:var(--good)"></i>Fast &amp; accurate</span><span><i style="background:var(--warn)"></i>Fast, lower</span><span><i style="background:var(--bad)"></i>Slow, lower</span></div></div></div>'+
   '<div><div class="head"><span class="eyebrow">Skip items</span><h2>Skip handling</h2></div><div class="card" style="padding:16px"><div style="display:flex;gap:14px;flex-wrap:wrap">'+
   miniStat('Conflicting Data flagged',(sk.cd_pct!=null?sk.cd_pct+'%':'–'),sk.cd_correct+' of '+sk.cd_total+' correctly flagged',tier(sk.cd_pct))+
   miniStat('IBD suggestion match',(sk.ibd_pct!=null?sk.ibd_pct+'%':'–'),sk.ibd_correct+' of '+sk.ibd_scored+' within 50% of golden',tier(sk.ibd_pct))+
   '</div><div class="note"><b>Conflicting Data:</b> correct action is to flag/skip. <b>Insufficient Base Data:</b> correct when the suggested PT is ≥50% similar to the golden suggestion. '+(sk.ibd_total-sk.ibd_scored)+' IBD items had no golden suggestion to score against.</div></div></div></section>';
 h+='<section class="two"><div><div class="head"><span class="eyebrow">Where it breaks</span><h2>Hardest categories</h2><span class="sub">accuracy, items ≥ 6</span></div><div class="card"><div class="bars" id="cb"></div></div></div>'+
   '<div><div class="head"><span class="eyebrow">Confusions</span><h2>Top mistakes</h2><span class="sub">click a row for example products</span></div><div class="card"><div id="cf"></div></div></div></section>';
 document.getElementById('t').innerHTML=h;
 renderLB();scatter();cats();conf();
 document.querySelectorAll('#lb th.sortable').forEach(th=>th.onclick=()=>sortLB(th.dataset.k));
}
let sortK='accuracy',sortDir=-1;
function sortLB(kk){if(sortK===kk)sortDir*=-1;else{sortK=kk;sortDir=(kk==='annotator')?1:-1;}renderLB();}
function renderLB(){
 const rows=[...DATA.leaderboard].sort((a,b)=>{let x=a[sortK],y=b[sortK];if(typeof x==='string')return sortDir*x.localeCompare(y);x=x==null?-1:x;y=y==null?-1:y;return sortDir*(x-y);});
 document.getElementById('lbb').innerHTML=rows.map(r=>{const lead=r.rank===1;return '<tr class="'+(lead?'leader':'')+'"><td class="rankcell num">'+r.rank+'</td><td><div class="name">'+esc(r.annotator)+(lead?' <span class="pill" style="background:var(--good-soft);color:var(--good)">Top</span>':'')+'</div><div class="email">'+esc(r.email)+'</div></td><td class="num"><div class="abar"><div class="track"><div class="fill" style="width:'+r.accuracy+'%;background:'+tcol(r.accuracy)+'"></div></div><span class="pct" style="color:'+tcol(r.accuracy)+'">'+r.accuracy+'</span></div></td><td class="num" style="color:'+tcol(r.hlqa_accuracy)+';font-weight:600">'+(r.hlqa_accuracy==null?'–':r.hlqa_accuracy)+'</td><td class="num" style="color:'+tcol(r.lenient_accuracy)+';font-weight:600">'+(r.lenient_accuracy==null?'–':r.lenient_accuracy)+'</td><td class="num hide-sm" style="color:'+tcol(r.b63)+'">'+(r.b63==null?'–':r.b63)+'</td><td class="num hide-sm" style="color:'+tcol(r.b67)+'">'+(r.b67==null?'–':r.b67)+'</td><td class="num hide-sm">'+(r.partial||0)+'</td><td class="num">'+r.items+'</td><td class="num">'+fmtT(r.avg_time_task_sec)+'</td><td class="num hide-sm">'+(r.cd_total?r.cd_correct+'/'+r.cd_total:'–')+'</td></tr>';}).join('');
 document.querySelectorAll('#lb th.sortable').forEach(th=>{const b=th.textContent.replace(/[▲▼]/g,'').trim();th.innerHTML=b+(th.dataset.k===sortK?' <span class="arr">'+(sortDir<0?'▼':'▲')+'</span>':'');});
}
function scatter(){
 const d=DATA.leaderboard.filter(r=>r.avg_time_task_sec!=null);const W=520,H=340,m={t:16,r:16,b:44,l:44};
 const xs=d.map(r=>r.avg_time_task_sec),ys=d.map(r=>r.accuracy);
 const xmin=Math.min(...xs)*.9,xmax=Math.max(...xs)*1.05,ymin=Math.max(0,Math.min(...ys)-8),ymax=Math.min(100,Math.max(...ys)+8);
 const px=v=>m.l+(v-xmin)/(xmax-xmin)*(W-m.l-m.r),py=v=>H-m.b-(v-ymin)/(ymax-ymin)*(H-m.t-m.b);
 const medT=[...xs].sort((a,b)=>a-b)[Math.floor(xs.length/2)],accL=DATA.kpis.overall_accuracy;
 let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:100%;height:auto" font-family="Inter">';
 for(let g=Math.ceil(ymin/10)*10;g<=ymax;g+=10){s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+py(g)+'" y2="'+py(g)+'" stroke="var(--line)"/><text x="'+(m.l-8)+'" y="'+(py(g)+3)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+g+'</text>';}
 s+='<line x1="'+px(medT)+'" x2="'+px(medT)+'" y1="'+m.t+'" y2="'+(H-m.b)+'" stroke="var(--muted)" stroke-dasharray="4 4" opacity=".6"/>';
 s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+py(accL)+'" y2="'+py(accL)+'" stroke="var(--accent)" stroke-dasharray="4 4" stroke-width="1.2"/><text x="'+(W-m.r)+'" y="'+(py(accL)-5)+'" text-anchor="end" font-size="9.5" fill="var(--accent)">cohort avg '+accL+'%</text>';
 s+='<text x="'+(W/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="var(--muted)">Avg time per task &rarr;</text><text transform="translate(13,'+((H-m.b+m.t)/2)+') rotate(-90)" text-anchor="middle" font-size="11" fill="var(--muted)">Accuracy %</text>';
 [xmin,medT,xmax].forEach(v=>{s+='<text x="'+px(v)+'" y="'+(H-m.b+16)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+fmtT(v)+'</text>';});
 d.forEach(r=>{const fast=r.avg_time_task_sec<=medT,hi=r.accuracy>=accL;const col=hi?'var(--good)':(fast?'var(--warn)':'var(--bad)');s+='<g class="pt" data-n="'+esc(r.annotator)+'" data-a="'+r.accuracy+'" data-t="'+fmtT(r.avg_time_task_sec)+'"><circle cx="'+px(r.avg_time_task_sec)+'" cy="'+py(r.accuracy)+'" r="13" fill="'+col+'" opacity=".16"/><circle cx="'+px(r.avg_time_task_sec)+'" cy="'+py(r.accuracy)+'" r="7" fill="'+col+'" stroke="var(--surface)" stroke-width="1.5"/><text x="'+px(r.avg_time_task_sec)+'" y="'+(py(r.accuracy)-12)+'" text-anchor="middle" font-size="9.5" font-weight="700" fill="var(--ink)">'+initials(r.annotator)+'</text></g>';});
 s+='</svg>';const el=document.getElementById('sc');el.innerHTML=s;
 el.querySelectorAll('.pt').forEach(g=>{g.addEventListener('mousemove',e=>showTip(e,g.dataset.n+' — '+g.dataset.a+'% · '+g.dataset.t));g.addEventListener('mouseleave',hideTip);});
}
function cats(){document.getElementById('cb').innerHTML=DATA.hardest_categories.map(c=>{const a=c.acc;return '<div class="brow"><div class="lbl" title="'+esc(c.golden)+'">'+esc(c.golden)+'</div><div class="tr"><div class="fl" style="width:'+a+'%;background:'+tcol(a)+'"></div></div><div class="rt"><span class="pv">'+a+'<small>%</small></span><span class="cn">'+c.n+'</span></div></div>';}).join('');}
function exImg(e){const url=e.image,link=e.image||e.walmart||'';const inner=url?('<img loading="lazy" src="'+esc(url)+'" alt="" onerror="this.outerHTML=\'<div class=&quot;noimg&quot;>open ↗</div>\'">'):'<div class="noimg">open ↗</div>';return link?('<a class="ex" href="'+esc(link)+'" target="_blank" rel="noopener">'+inner+'<div><div class="pn">'+esc(e.product_name)+'</div><div class="meta">'+esc(e.annotator)+' · Batch '+esc(e.assessment)+'</div></div></a>'):('<div class="ex">'+inner+'<div><div class="pn">'+esc(e.product_name)+'</div><div class="meta">'+esc(e.annotator)+' · Batch '+esc(e.assessment)+'</div></div></div>');}
function conf(){const ex=DATA.confusion_examples||{};document.getElementById('cf').innerHTML=DATA.confusions.map((c,i)=>{const items=ex[c.golden+'|||'+c.pick]||[];const cards=items.map(exImg).join('');return '<div class="conf-item" id="ci'+i+'"><div class="conf-head" onclick="document.getElementById(\'ci'+i+'\').classList.toggle(\'open\')"><span class="chev">▶</span><span class="g">'+esc(c.golden)+'</span><span class="arrow">&rarr;</span><span class="p">'+esc(c.pick)+'</span><span class="n">'+c.n+' ×</span></div><div class="conf-panel">'+(cards||'<div class="meta" style="color:var(--muted);font-size:12px">No examples.</div>')+'</div></div>';}).join('');}
build();
</script>
